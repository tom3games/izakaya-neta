<style>
[hidden]{display:none!important}
:root{--ink:#2a1a10;--paper:#f6efe0;--red:#b8322a;--red2:#7e1f19;--wood:#3b2516;--amber:#f2b25c;--night:#1c120c;--cold:#5b7a96;

*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night);height:100%;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--sans);color:var(--ink);overflow:hidden;height:100%;background:transparent;position:fixed;inset:0}

#app{position:fixed;left:0;right:0;top:0;height:var(--vh,100svh);overflow:hidden}
.view{position:absolute;inset:0;overflow:hidden}
.wrap{position:relative;height:100%;max-width:520px;margin:0 auto}

/* 読み込み（提灯がゆれる） */
#loading{position:fixed;inset:0;z-index:90;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
#loading svg{width:70px;height:112px;transform-origin:50% 0;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
#loading p{font-family:var(--hand);font-size:16px;color:#f3dfbf;letter-spacing:.08em}
#loadBar{width:150px;height:3px;background:rgba(255,255,255,.12);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}

/* 右上の小さいボタン */

/* 店の中（背景・席の人・卓の手前） */

/* #seats は filter（酔い）で包むので、場面いっぱいの箱にしておく（filter のかかった箱が人の位置の基準になる） */
#seats{position:absolute;inset:0}
#tags{position:absolute;inset:0;z-index:24;pointer-events:none}

.person img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;transition:opacity .12s;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.person img.on{opacity:1}
.person.enter{animation:enter .7s ease-out}
@keyframes enter{0%{transform:translateX(40%) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.person.bob{animation:bob .9s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-2.5%) rotate(-1deg)}}
.person.lean{transform:translateY(1.5%) scale(.98)}
.person,.person img{pointer-events:none}
.person .hit{position:absolute;left:24%;right:24%;top:5%;bottom:34%;z-index:2;border-radius:40%;pointer-events:auto}
/* 卓の上の物 */
.tag{position:absolute;z-index:24;transform:translateX(-50%) rotate(var(--r,0deg));background:linear-gradient(#fbf4e3,#efe2c4);color:var(--ink);font-family:var(--hand);font-size:13px;line-height:1;padding:5px 8px 6px;border-top:3px solid var(--red);box-shadow:0 2px 3px rgba(0,0,0,.45);white-space:nowrap;pointer-events:auto;min-height:24px}
#slip{position:absolute;z-index:25;left:10px;transform:rotate(-4deg);width:122px;background:#fbf7ee;box-shadow:0 3px 6px rgba(0,0,0,.5);padding:6px 8px 8px;font-family:var(--hand);color:var(--ink)}
#slip::before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 4px 0,transparent 3px,#fbf7ee 3.5px) 0 0/8px 6px repeat-x}
#slip .sh{display:flex;justify-content:space-between;font-size:11px;color:#6b5a48;border-bottom:1px solid #d9cdb6;padding-bottom:2px}
#slip .row{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:13px}
#slip .row b{font-weight:400;font-size:11px;color:#6b5a48;width:4.2em;flex:none;white-space:nowrap}
#tally{display:flex;flex-wrap:wrap;gap:1px 3px;min-height:20px;align-items:center}
#tally svg{width:16px;height:16px}
#tallyN{font-size:12px;color:#6b5a48}
#miss{display:flex;gap:5px}
#miss i{width:17px;height:17px;border:1.5px solid #8a7a66;border-radius:50%;display:block;position:relative}
#miss i.on{border-color:var(--red)}
#miss i.on::after{content:"";position:absolute;inset:1px;background:linear-gradient(45deg,transparent 44%,var(--red) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--red) 44% 56%,transparent 56%)}
#nabe{position:absolute;z-index:25;right:12px;width:92px;height:84px;pointer-events:none}
#nabe svg{width:100%;height:100%;overflow:visible}
#flame{transform-origin:46px 70px;transition:transform .8s ease}
#flame.flick{animation:flick .18s steps(2) infinite}

#clock{position:absolute;z-index:30;left:10px;top:max(10px,env(safe-area-inset-top));background:#20140c;color:#f3dfbf;font-family:var(--hand);font-size:15px;padding:6px 10px;border:1px solid #5a3d26;box-shadow:0 2px 4px rgba(0,0,0,.4)}

/* 一言・判定・お知らせ */
.bub{position:absolute;z-index:40;max-width:min(76%,330px);background:#fffaf0;border:2px solid var(--ink);border-radius:14px;padding:7px 12px 8px;font-size:16px;font-weight:700;line-height:1.35;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .15s;text-wrap:balance;line-break:strict;word-break:normal;overflow-wrap:anywhere}

#stamp{position:absolute;z-index:45;left:50%;pointer-events:none;font-family:var(--brush);font-size:min(17vw,82px);line-height:1;color:var(--red);border:5px solid currentColor;border-radius:10px;padding:6px 14px 10px;transform:translate(-50%,-50%) rotate(-9deg);opacity:0;background:rgba(251,247,238,.82);white-space:nowrap}
#stamp.on{animation:stampIn .32s cubic-bezier(.2,1.4,.5,1) forwards}

#stamp.v-big{color:#c42a1f}#stamp.v-good{color:#c06a15;font-size:min(14vw,66px)}#stamp.v-meh{color:#6b6359;font-size:min(12vw,56px)}#stamp.v-flop{color:#3e6488}#stamp.v-cringe{color:#2d2a33}
#banner{position:absolute;z-index:46;left:0;right:0;padding:12px 18px;background:rgba(20,12,8,.88);color:#fbe9cc;font-family:var(--hand);font-size:18px;text-align:center;border-top:1px solid #8a6440;border-bottom:1px solid #8a6440;transform:translateX(-105%);transition:transform .35s ease;pointer-events:none}
#banner.on{transform:none}
#tenin{position:absolute;z-index:23;bottom:0;right:-60%;width:56%;aspect-ratio:2/3;transition:right .45s ease;pointer-events:none}
#tenin img{width:100%;height:100%;object-fit:contain;object-position:50% 100%}

@keyframes poke{50%{transform:translate(5px,8px) scale(.92)}}

/* 打つところ */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:50;background:#20140c;border-top:1px solid #4d331f;padding:8px 10px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#bar .in{display:flex;gap:8px;max-width:520px;margin:0 auto}
#neta{flex:1;min-width:0;height:48px;border-radius:10px;border:2px solid #6b4a2e;background:#fbf4e6;color:var(--ink);font-size:16px;padding:0 12px;outline:none}

#bSay{flex:none;min-width:84px;height:48px;border-radius:10px;background:var(--red);color:#fff3e2;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--red2);letter-spacing:.06em}

/* タイトル（のれん） */
#vTitle{z-index:10}

#tShade{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(20,12,8,.9) 70%);pointer-events:none}
#vTitle .bgLayer{filter:blur(2px) brightness(.55)}
#noren{position:absolute;left:0;right:0;top:0;height:min(48%,400px);display:flex;gap:4px;padding:0 4px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
#noren div{flex:1;background:linear-gradient(#25304f,#1b2440);border-radius:0 0 4px 4px;position:relative;transform-origin:50% 0;animation:wave 5s ease-in-out infinite}

@keyframes wave{50%{transform:skewX(1.2deg)}}
#noren::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#5a3d26;z-index:2}

#tName span{writing-mode:vertical-rl;font-family:var(--brush);color:#f6efe0;font-size:min(12vw,6.2svh,62px);line-height:1.05;letter-spacing:.04em;white-space:nowrap}

#tName.en{flex-direction:column;align-items:center;justify-content:center}
#tName.en span{writing-mode:horizontal-tb;font-family:var(--brush);font-size:min(12vw,54px);margin:0}
#tLow{position:absolute;left:0;right:0;bottom:0;top:min(48%,400px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:16px 16px calc(22px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#tSub{font-family:var(--hand);font-size:18px;color:#fff3dc;text-shadow:0 1px 3px #000,0 0 12px #000;text-align:center}
#tBest{font-family:var(--hand);font-size:14px;color:#d9be98;min-height:18px}
.big{width:min(80vw,300px);min-height:58px;border-radius:8px;background:var(--red);color:#fff3e2;font-weight:800;font-size:20px;letter-spacing:.12em;box-shadow:0 5px 0 var(--red2),0 10px 22px rgba(0,0,0,.45)}

.tLinks{display:flex;gap:20px}

/* 今夜の顔ぶれ（箸袋のカード） */
#vMeet{z-index:12;background:rgba(18,10,6,.86)}
#vMeet .wrap{display:flex;flex-direction:column;align-items:center;padding:calc(64px + env(safe-area-inset-top)) 14px calc(18px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));gap:10px}
#meetName{font-family:var(--brush);font-size:30px;color:#f6efe0}
#meetSub{font-family:var(--hand);font-size:14px;color:#d9be98;margin-top:-6px}
#cards{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center;gap:9px}
.card{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fbf4e3,#f1e4c8);padding:6px 12px 6px 6px;border-left:5px solid var(--red);box-shadow:0 3px 6px rgba(0,0,0,.4);transform:rotate(var(--r,0deg))}
.card .ph{width:min(19vw,74px);aspect-ratio:1;flex:none;overflow:hidden;background:#3a2516;border-radius:3px}

.card .tx{flex:1;min-width:0;font-family:var(--hand);color:var(--ink)}

.card.late .ph{display:flex;align-items:center;justify-content:center;font-family:var(--brush);font-size:34px;color:#c9ab84}
#bKanpai{flex:none}

/* 人のカード（遊び中に人を押した時） */
#peek{position:absolute;z-index:80;left:50%;top:40%;transform:translate(-50%,-50%);width:min(86vw,330px)}

/* 遊び方 */
#vHow{z-index:85;background:rgba(14,8,5,.9)}

.menuPaper{background:#f8f1e1;padding:16px 16px 14px;box-shadow:0 8px 20px rgba(0,0,0,.5);font-size:15px;line-height:1.6;color:var(--ink);max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:6px}

#billBox{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
#bill{position:relative;width:min(100%,380px);max-height:100%;background:#fbf7ee;color:var(--ink);font-family:var(--hand);padding:16px 16px 14px;box-shadow:0 10px 26px rgba(0,0,0,.55);transform:rotate(-1.2deg);overflow:hidden;display:flex;flex-direction:column;gap:5px;animation:billIn .5s ease-out}
@keyframes billIn{0%{transform:translateY(40%) rotate(4deg);opacity:0}100%{transform:rotate(-1.2deg);opacity:1}}
#bill::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,#c9b99c 0 2px,transparent 2px 7px);opacity:.5}

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険。JS が動いたか（__jsUp）で判定し、読み込み中は失敗と出さない
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },6000);
})();
</script>
